name: Maintenance checks

on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python -B -m unittest discover -s scripts/tests -v
      - run: python -B -m unittest discover -s tests -p 'test_sync_upstream.py' -v
