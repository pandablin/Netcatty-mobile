name: Mobile CI

on:
  push:
    branches: ['**']
    # Pushing a vX.Y.Z tag builds everything and publishes a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes the previous run, so queued
# macOS jobs do not pile up behind stale commits.
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Restore persistent Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            # Forks have no access to the upstream keystore. Fall back to the
            # debug key (see android/app/build.gradle.kts) instead of failing.
            echo "::warning::Android signing secrets are not configured; APKs will be debug-signed"
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/netcatty-release.jks
      - name: Build Android release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/netcatty-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: netcatty
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${GITHUB_OAUTH_CLIENT_ID//[[:space:]]/}" ]]; then
            echo "::warning::GITHUB_OAUTH_CLIENT_ID is not configured. GitHub device login will be unavailable in these APKs; manual tokens, WebDAV and S3 remain available."
          fi
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            "--dart-define=GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/netcatty-mobile-v${{ steps.app_version.outputs.version }}-android.apk"
          flutter build apk --release --split-per-abi \
            --build-number=${{ github.run_number }} \
            "--dart-define=GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}"
      - name: Prepare Android package
        shell: bash
        run: |
          VERSION="${{ steps.app_version.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-armeabi-v7a.apk"
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "dist/netcatty-mobile-v${VERSION}-android-x86_64.apk"
      - name: Upload Android package
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mobile-v${{ steps.app_version.outputs.version }}-android-apks-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  ios:
    # macos-latest is macOS 26 with a newer Xcode / iOS SDK, closer to the
    # iOS 27 devices this fork targets, and has more runner capacity.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.GITHUB_OAUTH_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          APP_VERSION="${APP_VERSION%%+*}"
          if [[ ! "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid pubspec version: $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - run: flutter pub get
      - name: Build unsigned iOS release app
        shell: bash
        run: |
          if [[ -z "${GITHUB_OAUTH_CLIENT_ID//[[:space:]]/}" ]]; then
            echo "::warning::GITHUB_OAUTH_CLIENT_ID is not configured. GitHub device login will be unavailable in this IPA; manual tokens, WebDAV and S3 remain available."
          fi
          flutter build ios --release --no-codesign \
            "--dart-define=GITHUB_OAUTH_CLIENT_ID=${GITHUB_OAUTH_CLIENT_ID}"
      - name: Package re-signable IPA
        shell: bash
        run: |
          PACKAGE="netcatty-mobile-v${{ steps.app_version.outputs.version }}-ios-unsigned.ipa"
          APPEX=build/ios/iphoneos/Runner.app/PlugIns/NetcattyWidgets.appex
          if [[ ! -f "$APPEX/NetcattyWidgets" ]]; then
            echo "Live Activity widget extension is missing from Runner.app" >&2
            exit 1
          fi
          du -sh "$APPEX"
          mkdir -p dist build/ios/iphoneos/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent Payload "../../../dist/$PACKAGE"
      - name: Upload re-signable IPA
        uses: actions/upload-artifact@v4
        with:
          name: netcatty-mobile-v${{ steps.app_version.outputs.version }}-ios-unsigned-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    # Publishes v<pubspec version> once: on the first push to main that
    # carries a version without a release (or on a pushed v* tag). Later
    # pushes with the same version skip this job's publish step.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [test, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          APP_VERSION="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
          TAG="v${APP_VERSION%%+*}"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match pubspec version $TAG" >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          ls -l dist
          NOTES="docs/releases/${TAG}.md"
          ARGS=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Netcatty Mobile ${TAG#v}")
          case "$TAG" in *-*) ARGS+=(--prerelease) ;; esac
          if [ -f "$NOTES" ]; then
            ARGS+=(--notes-file "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" dist/* "${ARGS[@]}"
