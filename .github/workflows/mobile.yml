name: Netcatty Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Leave empty for this commit; automation uses its candidate branch'
        type: string
        default: ''
      promote:
        description: 'Promote a tested upstream candidate to main'
        type: boolean
        default: false
      base_sha:
        type: string
        default: ''
      upstream_sha:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: netcatty-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate dispatch inputs
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
          PROMOTE: ${{ inputs.promote }}
          BASE_SHA: ${{ inputs.base_sha }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        shell: bash
        run: |
          if [[ -n "$SOURCE_REF" && "$SOURCE_REF" != main && ! "$SOURCE_REF" =~ ^automation/upstream-[0-9a-f]{40}$ ]]; then
            echo 'Unsupported source ref'; exit 1
          fi
          if [[ "$PROMOTE" == true ]]; then
            [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$UPSTREAM_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$SOURCE_REF" == "automation/upstream-$UPSTREAM_SHA" ]]
          elif [[ -n "$SOURCE_REF" && "$SOURCE_REF" != main ]]; then
            echo 'Candidate refs require promotion validation'; exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Record immutable source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: false
      - run: python -B -m unittest discover -s scripts/tests -v
      - run: python -B -m unittest discover -s tests -p 'test_sync_upstream.py' -v
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    if: github.repository == 'pandablin/Netcatty-mobile' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate candidate ancestry
        if: inputs.promote == true
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        run: |
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: false
      - run: flutter pub get
      - name: Ensure APK verification tools
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;36.0.0"'
      - name: Build with the persistent signing identity
        env:
          NETCATTY_GITHUB_OAUTH_CLIENT_ID: ${{ vars.NETCATTY_GITHUB_OAUTH_CLIENT_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in NETCATTY_GITHUB_OAUTH_CLIENT_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing required configuration: $name"; exit 1; }
          done
          umask 077
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/netcatty-signing.keystore"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          flutter build apk --release --split-per-abi --target-platform android-arm64 --no-pub \
            "--dart-define=GITHUB_OAUTH_CLIENT_ID=$NETCATTY_GITHUB_OAUTH_CLIENT_ID"
      - name: Verify and package the APK
        env:
          NETCATTY_GITHUB_OAUTH_CLIENT_ID: ${{ vars.NETCATTY_GITHUB_OAUTH_CLIENT_ID }}
        run: python -B scripts/package_android.py --apk build/app/outputs/flutter-apk/app-arm64-v8a-release.apk --output-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: Netcatty-Android-${{ needs.checks.outputs.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
      - name: Promote the verified upstream candidate
        if: inputs.promote == true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ needs.checks.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT=$(gh api repos/pandablin/Netcatty-mobile/git/ref/heads/main --jq .object.sha)
          [[ "$CURRENT" == "$BASE_SHA" ]] || { echo 'main advanced; refusing to overwrite it'; exit 1; }
          git -c 'credential.helper=!gh auth git-credential' push origin "$SOURCE_SHA:refs/heads/main"
      - name: Publish the owned release
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
        shell: bash
        run: |
          ARGS=(--dist dist)
          if [[ -n "$UPSTREAM_SHA" ]]; then ARGS+=(--upstream-sha "$UPSTREAM_SHA"); fi
          python -B scripts/publish_release.py "${ARGS[@]}"
