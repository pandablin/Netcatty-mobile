name: netcatty_mobile
description: Netcatty mobile SSH, SFTP and cloud-sync client for Android and iOS.
publish_to: none
version: 1.10.0+48

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dartssh2: ^2.22.3
  # Vendored xterm2 5.2.0 (MIT) with an opt-in keyboard-suggestion mode, see
  # packages/xterm2/VENDORED.md.
  xterm2:
    path: packages/xterm2
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.3
  cryptography: ^2.7.0
  aws_common: ^0.7.12
  aws_signature_v4: ^0.6.13
  http: ^1.4.0
  uuid: ^4.5.1
  file_picker: ^10.2.0
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  flutter_svg: ^2.2.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.0
  highlight: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/distro_png/
    - assets/docker/
    - assets/fonts/OFL-DMSans.txt
    - assets/fonts/OFL-Lora.txt
  # Interface fonts (SIL OFL): DM Sans for UI text, Lora for headings. Static
  # Latin subsets; Chinese falls back to the system font (PingFang).
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
